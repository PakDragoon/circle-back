<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Circle Back</title>
    <link rel="stylesheet" href="../ui/page.css" />
    <style>
      body { width: 320px; }
      .wrap { padding: 16px; display: grid; gap: 14px; }
      .here { padding: 12px; border-radius: 12px; background: var(--paper-2); font-size: 13px; display: grid; gap: 8px; }
      .here p { margin: 0; color: var(--ink-2); }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
      .stat b { display: block; font-size: 20px; line-height: 1.1; letter-spacing: -.02em; }
      .stat span { font-size: 11.5px; color: var(--ink-3); }
      h2 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
      ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
      li { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      li .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
      li .bar i { display: block; height: 100%; background: var(--coral); border-radius: 3px; }
      li .n { width: 28px; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
      li .l { width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .empty { font-size: 13px; color: var(--ink-3); margin: 0; }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>
    <script src="popup.js"></script>
  </body>
</html>
